name: Build SecureBrowse APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: securebrowse

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true
        working-directory: ${{ github.workspace }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --warning-mode all

      - name: Build Kiosk APK
        run: ./gradlew :app:assembleKiosk --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: securebrowse-debug-apk
          path: securebrowse/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Kiosk APK
        uses: actions/upload-artifact@v4
        with:
          name: securebrowse-kiosk-apk
          path: securebrowse/app/build/outputs/apk/kiosk/*.apk
          if-no-files-found: warn
